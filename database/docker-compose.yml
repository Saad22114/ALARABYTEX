services:
  db:
    image: postgres:17
    container_name: fabric_arabi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fabric_arabi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fabric_arabi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: